  icon: github
  image: /assets/img/Home関連/github_logo.png

- label: Twitter
  url: https://x.com/Mitorow_uec23
  color: chip-0
  icon: twitter
  image: /assets/img/Home関連/twitter_logo.png

- label: YouTube
  # note: "みとろーchannel"
  url: https://www.youtube.com/@mitorow
  color: chip-7
  icon: youtube
  image: /assets/img/Home関連/youtube_logo.png
